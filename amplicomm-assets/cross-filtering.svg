<?xml version="1.0"?>
<svg viewBox="0 0 1300 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.08"></feDropShadow>
    </filter>
    <marker id="arrowD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5d8f"></path>
    </marker>
  </defs>
  <rect width="1300" height="660" fill="#F6F7F9"></rect>
  <text x="48" y="46" font-size="27" font-weight="800" fill="#1e3a5f">Cross-filtering — one interaction, four different jobs</text>
  <text x="48" y="68" font-size="17.5" fill="#8792a2">Clicking any chart element re-filters the whole dashboard instantly — instead of manually rebuilding the same view in the top filter bar</text>

  <g filter="url(#softD)">
    <rect x="48" y="90" width="300" height="130" rx="14" fill="white"></rect>
    <rect x="388" y="90" width="300" height="130" rx="14" fill="white"></rect>
    <rect x="728" y="90" width="300" height="130" rx="14" fill="white"></rect>
  </g>
  <text x="70" y="126" font-size="17" font-weight="800" fill="#1e3a5f">1. Click a chart element</text>
  <text x="70" y="150" font-size="15.5" fill="#3A3A46">A channel slice, a SKU bar, a</text>
  <text x="70" y="170" font-size="15.5" fill="#3A3A46">category segment — any mark</text>
  <text x="70" y="190" font-size="15.5" fill="#3A3A46">on any chart is a filter control.</text>

  <text x="410" y="126" font-size="17" font-weight="800" fill="#1e3a5f">2. Whole dashboard reacts</text>
  <text x="410" y="150" font-size="15.5" fill="#3A3A46">KPIs, the trend line, and every</text>
  <text x="410" y="170" font-size="15.5" fill="#3A3A46">other chart update to that</text>
  <text x="410" y="190" font-size="15.5" fill="#3A3A46">selection — no page reload.</text>

  <text x="750" y="126" font-size="17" font-weight="800" fill="#1e3a5f">3. Top filter bar stays in sync</text>
  <text x="750" y="150" font-size="15.5" fill="#3A3A46">The selection appears as a real</text>
  <text x="750" y="170" font-size="15.5" fill="#3A3A46">filter chip, so it&#39;s visible,</text>
  <text x="750" y="190" font-size="15.5" fill="#3A3A46">removable, and shareable.</text>

  <g stroke="#2f5d8f" stroke-width="2" marker-end="url(#arrowD)">
    <line x1="348" y1="155" x2="383" y2="155"></line>
    <line x1="688" y1="155" x2="723" y2="155"></line>
  </g>

  <text x="48" y="252" font-size="17.5" font-weight="800" fill="#1e3a5f">The same click means something different to each persona</text>

  <g filter="url(#softD)">
    <rect x="48" y="270" width="290" height="232" rx="14" fill="white"></rect>
    <rect x="356" y="270" width="290" height="232" rx="14" fill="white"></rect>
    <rect x="664" y="270" width="290" height="232" rx="14" fill="white"></rect>
    <rect x="972" y="270" width="290" height="232" rx="14" fill="white"></rect>
  </g>

  <circle cx="82" cy="306" r="20" fill="#E7EEF7"></circle><text x="82" y="312" font-size="17" font-weight="800" fill="#1d4e89" text-anchor="middle">F</text>
  <text x="112" y="312" font-size="17" font-weight="800" fill="#1e3a5f">Founder / CEO</text>
  <text x="70" y="344" font-size="15" fill="#3A3A46">Clicks the top channel slice</text>
  <text x="70" y="364" font-size="15" fill="#3A3A46">to see if GMV growth is</text>
  <text x="70" y="384" font-size="15" fill="#3A3A46">concentrated in one channel</text>
  <text x="70" y="404" font-size="15" fill="#3A3A46">or spread evenly.</text>
  <rect x="70" y="420" width="240" height="28" rx="14" fill="#E7EEF7"></rect>
  <text x="190" y="438" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">Needs: the 30-second answer</text>

  <circle cx="390" cy="306" r="20" fill="#EAF3EC"></circle><text x="390" y="312" font-size="17" font-weight="800" fill="#2e6b3e" text-anchor="middle">C</text>
  <text x="420" y="312" font-size="17" font-weight="800" fill="#1e3a5f">Category manager</text>
  <text x="378" y="344" font-size="15" fill="#3A3A46">Clicks a category bar to filter</text>
  <text x="378" y="364" font-size="15" fill="#3A3A46">every KPI and the insights feed</text>
  <text x="378" y="384" font-size="15" fill="#3A3A46">down to just that category&#39;s</text>
  <text x="378" y="404" font-size="15" fill="#3A3A46">SKUs.</text>
  <rect x="378" y="420" width="220" height="28" rx="14" fill="#EAF3EC"></rect>
  <text x="488" y="438" font-size="14" fill="#2e6b3e" text-anchor="middle" font-weight="700">Needs: SKU-level depth</text>

  <circle cx="698" cy="306" r="20" fill="#FBEFE1"></circle><text x="698" y="312" font-size="17" font-weight="800" fill="#a3610b" text-anchor="middle">M</text>
  <text x="728" y="312" font-size="17" font-weight="800" fill="#1e3a5f">Marketing / Ads lead</text>
  <text x="686" y="344" font-size="15" fill="#3A3A46">Clicks a TACOS spike point to</text>
  <text x="686" y="364" font-size="15" fill="#3A3A46">see which channel and SKUs</text>
  <text x="686" y="384" font-size="15" fill="#3A3A46">drove the ad-spend jump that</text>
  <text x="686" y="404" font-size="15" fill="#3A3A46">day.</text>
  <rect x="686" y="420" width="240" height="28" rx="14" fill="#FBEFE1"></rect>
  <text x="806" y="438" font-size="14" fill="#a3610b" text-anchor="middle" font-weight="700">Needs: cause, not just effect</text>

  <circle cx="1006" cy="306" r="20" fill="#F7E9EC"></circle><text x="1006" y="312" font-size="17" font-weight="800" fill="#a3324a" text-anchor="middle">O</text>
  <text x="1036" y="312" font-size="17" font-weight="800" fill="#1e3a5f">Operations lead</text>
  <text x="994" y="344" font-size="15" fill="#3A3A46">Clicks a &#34;Low Stock&#34; insight</text>
  <text x="994" y="364" font-size="15" fill="#3A3A46">to filter the whole dashboard</text>
  <text x="994" y="384" font-size="15" fill="#3A3A46">to just that SKU&#39;s channel</text>
  <text x="994" y="404" font-size="15" fill="#3A3A46">and delivery performance.</text>
  <rect x="994" y="420" width="256" height="28" rx="14" fill="#F7E9EC"></rect>
  <text x="1122" y="438" font-size="14" fill="#a3324a" text-anchor="middle" font-weight="700">Needs: act before it&#39;s a problem</text>

  <rect x="48" y="524" width="1214" height="112" rx="14" fill="#E7EEF7"></rect>
  <text x="72" y="552" font-size="17" font-weight="800" fill="#1e3a5f">Why one mechanic instead of four dashboards</text>
  <text x="72" y="578" font-size="15" fill="#3A3A46">Building four persona-specific dashboards would have meant four times the maintenance for a two-designer team, and forced</text>
  <text x="72" y="600" font-size="15" fill="#3A3A46">every future feature to ship four times. Cross-filtering let one dashboard structure serve every persona&#39;s actual question —</text>
  <text x="72" y="622" font-size="15" fill="#3A3A46">the difference was which element they clicked, not which screen they were on.</text>
</svg>