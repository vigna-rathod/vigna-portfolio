<?xml version="1.0"?>
<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.08"></feDropShadow>
    </filter>
  </defs>
  <rect width="1200" height="380" fill="#F6F7F9"></rect>
  <text x="48" y="46" font-size="27" font-weight="800" fill="#1e3a5f">From generic BI tool to a product sellers trust</text>
  <text x="48" y="70" font-size="17.5" fill="#8792a2">Four principles applied across every dashboard redesign</text>

  <g filter="url(#softB)">
    <rect x="44" y="100" width="264" height="232" rx="16" fill="#FFFFFF"></rect>
    <rect x="326" y="100" width="264" height="232" rx="16" fill="#FFFFFF"></rect>
    <rect x="608" y="100" width="264" height="232" rx="16" fill="#FFFFFF"></rect>
    <rect x="890" y="100" width="264" height="232" rx="16" fill="#FFFFFF"></rect>
  </g>

  <circle cx="84" cy="140" r="22" fill="#E7EEF7"></circle>
  <text x="84" y="148" font-size="20" font-weight="800" fill="#1d4e89" text-anchor="middle">1</text>
  <text x="66" y="182" font-size="18" font-weight="800" fill="#1e3a5f">One clear focal point</text>
  <text x="66" y="210" font-size="16" fill="#3A3A46">KPI panel anchors every</text>
  <text x="66" y="230" font-size="16" fill="#3A3A46">screen, driving the chart</text>
  <text x="66" y="250" font-size="16" fill="#3A3A46">below it — not competing.</text>
  <rect x="66" y="270" width="212" height="28" rx="14" fill="#E7EEF7"></rect>
  <text x="172" y="288" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="700">Fixes &#34;no focal point&#34;</text>

  <circle cx="366" cy="140" r="22" fill="#EAF3EC"></circle>
  <text x="366" y="148" font-size="20" font-weight="800" fill="#2e6b3e" text-anchor="middle">2</text>
  <text x="348" y="182" font-size="18" font-weight="800" fill="#1e3a5f">Self-explanatory time</text>
  <text x="348" y="210" font-size="16" fill="#3A3A46">Explicit period tabs and a</text>
  <text x="348" y="230" font-size="16" fill="#3A3A46">compare-period picker with</text>
  <text x="348" y="250" font-size="16" fill="#3A3A46">visible date ranges.</text>
  <rect x="348" y="270" width="234" height="28" rx="14" fill="#EAF3EC"></rect>
  <text x="465" y="288" font-size="14" fill="#2e6b3e" text-anchor="middle" font-weight="700">Fixes &#34;MTD/YTD unclear&#34;</text>

  <circle cx="648" cy="140" r="22" fill="#FBEFE1"></circle>
  <text x="648" y="148" font-size="20" font-weight="800" fill="#a3610b" text-anchor="middle">3</text>
  <text x="630" y="182" font-size="18" font-weight="800" fill="#1e3a5f">Reusable components</text>
  <text x="630" y="210" font-size="16" fill="#3A3A46">Chart-type, item-quantity,</text>
  <text x="630" y="230" font-size="16" fill="#3A3A46">and label controls behave</text>
  <text x="630" y="250" font-size="16" fill="#3A3A46">identically everywhere.</text>
  <rect x="630" y="270" width="228" height="28" rx="14" fill="#FBEFE1"></rect>
  <text x="744" y="288" font-size="14" fill="#a3610b" text-anchor="middle" font-weight="700">Fixes &#34;lacks consistency&#34;</text>

  <circle cx="930" cy="140" r="22" fill="#F7E9EC"></circle>
  <text x="930" y="148" font-size="20" font-weight="800" fill="#a3324a" text-anchor="middle">4</text>
  <text x="912" y="182" font-size="18" font-weight="800" fill="#1e3a5f">Depth on demand</text>
  <text x="912" y="210" font-size="16" fill="#3A3A46">Maximise view, compare</text>
  <text x="912" y="230" font-size="16" fill="#3A3A46">metrics, and drill-in stay</text>
  <text x="912" y="250" font-size="16" fill="#3A3A46">one click away, not upfront.</text>
  <rect x="912" y="270" width="248" height="28" rx="14" fill="#F7E9EC"></rect>
  <text x="1036" y="288" font-size="14" fill="#a3324a" text-anchor="middle" font-weight="700">Fixes &#34;too many distractions&#34;</text>
</svg>