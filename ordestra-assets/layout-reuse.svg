<svg viewBox="0 0 1300 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#3a1220" flood-opacity="0.10"></feDropShadow>
    </filter>
  </defs>
  <rect width="1300" height="380" fill="#FAF7F6"></rect>
  <text x="48" y="42" font-size="22" font-weight="800" fill="#3a1220">One layout, reused at every stage</text>
  <text x="48" y="64" font-size="13.5" fill="#8a7a7d">A list on the left, up to three active work columns on the right. The same structure whether you&#39;re picking, packing, or dispatching</text>

  <g filter="url(#softP)">
    <rect x="48" y="90" width="1204" height="200" rx="16" fill="white"></rect>
  </g>
  
  <rect x="70" y="112" width="180" height="156" rx="10" fill="#F7F7F7"></rect>
  <text x="84" y="132" font-size="11" font-weight="800" fill="#3a1220">List panel</text>
  <rect x="84" y="142" width="152" height="34" rx="6" fill="white" stroke="#E5DEDF"></rect>
  <rect x="84" y="182" width="152" height="34" rx="6" fill="white" stroke="#E5DEDF"></rect>
  <rect x="84" y="222" width="152" height="34" rx="6" fill="white" stroke="#E5DEDF"></rect>

  
  <g>
    <rect x="270" y="112" width="300" height="156" rx="10" fill="#FDF3F3" stroke="#F0D6DC"></rect>
    <rect x="586" y="112" width="300" height="156" rx="10" fill="#EEF6F1" stroke="#CFE7DA"></rect>
    <rect x="902" y="112" width="300" height="156" rx="10" fill="#EAF1F8" stroke="#CFDFEE"></rect>
  </g>
  <text x="284" y="132" font-size="11" font-weight="800" fill="#9c2444">Work column A</text>
  <text x="600" y="132" font-size="11" font-weight="800" fill="#2e6b3e">Work column B</text>
  <text x="916" y="132" font-size="11" font-weight="800" fill="#2f5d8f">Work column C</text>

  <g font-size="10" fill="#6b5a5d">
    <text x="284" y="150">Active items</text>
    <text x="600" y="150">Active items</text>
    <text x="916" y="150">Active items</text>
  </g>
  <rect x="284" y="158" width="272" height="30" rx="6" fill="white"></rect>
  <rect x="284" y="194" width="272" height="30" rx="6" fill="white"></rect>
  <rect x="600" y="158" width="272" height="30" rx="6" fill="white"></rect>
  <rect x="600" y="194" width="272" height="30" rx="6" fill="white"></rect>
  <rect x="916" y="158" width="272" height="30" rx="6" fill="white"></rect>
  <rect x="916" y="194" width="272" height="30" rx="6" fill="white"></rect>

  <rect x="284" y="236" width="272" height="24" rx="6" fill="#9c2444"></rect>
  <rect x="600" y="236" width="272" height="24" rx="6" fill="#9c2444" opacity="0.4"></rect>
  <rect x="916" y="236" width="272" height="24" rx="6" fill="#9c2444" opacity="0.4"></rect>

  
  <g font-size="12" font-weight="700" fill="#3a1220">
    <text x="130" y="310" text-anchor="middle">Ready to Pick</text>
    <text x="420" y="310" text-anchor="middle">Picking</text>
    <text x="736" y="310" text-anchor="middle">Packing</text>
    <text x="1052" y="310" text-anchor="middle">Dispatch</text>
  </g>
  <g font-size="10.5" fill="#8a7a7d">
    <text x="130" y="328" text-anchor="middle">List = picklists</text>
    <text x="420" y="328" text-anchor="middle">List = picklists in progress</text>
    <text x="736" y="328" text-anchor="middle">List = totes</text>
    <text x="1052" y="328" text-anchor="middle">List = carriers</text>
  </g>

  <rect x="48" y="345" width="1204" height="1" fill="#E5DEDF"></rect>
  <text x="48" y="368" font-size="12.5" fill="#3A3A46">A picker who&#39;s learned one stage already knows the shape of the next three. Only the content changes, not the mental model.</text>
</svg>