<svg viewBox="0 0 1300 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b5a5d"></path>
    </marker>
  </defs>
  <rect width="1300" height="1000" fill="#FAF7F6"></rect>
  <text x="48" y="42" font-size="22" font-weight="800" fill="#3a1220">User flow: picklist creation to dispatch</text>
  <text x="48" y="64" font-size="13.5" fill="#8a7a7d">Rectangles are actions, diamonds are decisions, arrows show every path including the ones that loop back</text>

  
  <rect x="560" y="90" width="180" height="44" rx="22" fill="#3a1220"></rect>
  <text x="650" y="117" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">Order marked ready</text>

  <line x1="650" y1="134" x2="650" y2="164" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <rect x="540" y="168" width="220" height="52" rx="10" fill="#9c2444"></rect>
  <text x="650" y="190" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">Supervisor groups orders</text>
  <text x="650" y="206" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">into a picklist</text>

  <line x1="650" y1="220" x2="650" y2="250" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <rect x="540" y="254" width="220" height="44" rx="10" fill="#b8305a"></rect>
  <text x="650" y="280" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">Assign picklist to a picker</text>

  <line x1="650" y1="298" x2="650" y2="328" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <polygon points="650,332 750,378 650,424 550,378" fill="white" stroke="#c6486e" stroke-width="2"></polygon>
  <text x="650" y="374" font-size="11.5" text-anchor="middle" fill="#3a1220" font-weight="700">Picker starts</text>
  <text x="650" y="390" font-size="11.5" text-anchor="middle" fill="#3a1220" font-weight="700">this list now?</text>

  <text x="758" y="372" font-size="11" fill="#6b5a5d">No</text>
  <path d="M 750 378 H 900 V 254 H 770" fill="none" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></path>
  <text x="905" y="258" font-size="10.5" fill="#8a7a7d">Stays in Ready to Pick,</text>
  <text x="905" y="272" font-size="10.5" fill="#8a7a7d">picker chooses another list</text>

  <text x="662" y="440" font-size="11" fill="#6b5a5d">Yes</text>
  <line x1="650" y1="424" x2="650" y2="454" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <rect x="540" y="458" width="220" height="52" rx="10" fill="#c6486e"></rect>
  <text x="650" y="480" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">Pick item from current</text>
  <text x="650" y="496" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">bin, confirm quantity</text>

  <line x1="650" y1="510" x2="650" y2="540" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <polygon points="650,544 760,590 650,636 540,590" fill="white" stroke="#c6486e" stroke-width="2"></polygon>
  <text x="650" y="586" font-size="11.5" text-anchor="middle" fill="#3a1220" font-weight="700">More bins</text>
  <text x="650" y="602" font-size="11.5" text-anchor="middle" fill="#3a1220" font-weight="700">left to pick?</text>

  <text x="380" y="586" font-size="11" fill="#6b5a5d">Yes, loop back</text>
  <path d="M 540 590 H 300 V 484 H 535" fill="none" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></path>

  <text x="662" y="652" font-size="11" fill="#6b5a5d">No, all picked</text>
  <line x1="650" y1="636" x2="650" y2="666" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <rect x="540" y="670" width="220" height="44" rx="10" fill="#3d7ab5"></rect>
  <text x="650" y="696" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">Move to Packing</text>

  <line x1="650" y1="714" x2="650" y2="744" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <rect x="540" y="748" width="220" height="52" rx="10" fill="#3d7ab5"></rect>
  <text x="650" y="770" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">Verify tote contents,</text>
  <text x="650" y="786" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">select box and carrier</text>

  <line x1="650" y1="800" x2="650" y2="830" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <polygon points="650,834 770,880 650,926 530,880" fill="white" stroke="#3d7ab5" stroke-width="2"></polygon>
  <text x="650" y="876" font-size="11.5" text-anchor="middle" fill="#3a1220" font-weight="700">Contents match</text>
  <text x="650" y="892" font-size="11.5" text-anchor="middle" fill="#3a1220" font-weight="700">the order exactly?</text>

  <text x="800" y="876" font-size="11" fill="#6b5a5d">No, flag it</text>
  <path d="M 770 880 H 1050 V 780 H 765" fill="none" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></path>
  <text x="1055" y="784" font-size="10.5" fill="#8a7a7d">Back to Verify tote</text>
  <text x="1055" y="798" font-size="10.5" fill="#8a7a7d">contents for recheck</text>

  <text x="662" y="942" font-size="11" fill="#6b5a5d">Yes</text>
  <line x1="650" y1="926" x2="650" y2="956" stroke="#6b5a5d" stroke-width="2" marker-end="url(#arrowF)"></line>

  
  <rect x="540" y="960" width="220" height="40" rx="10" fill="#2e6b3e"></rect>
  <text x="650" y="984" font-size="12.5" fill="white" text-anchor="middle" font-weight="700">Print label, ready for Dispatch</text>
</svg>