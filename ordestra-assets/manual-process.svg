<svg viewBox="0 0 1300 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#3a1220" flood-opacity="0.10"></feDropShadow>
    </filter>
  </defs>
  <rect width="1300" height="340" fill="#FAF7F6"></rect>
  <text x="48" y="42" font-size="22" font-weight="800" fill="#3a1220">The manual process this replaced</text>
  <text x="48" y="64" font-size="13.5" fill="#8a7a7d">Before Ordestra, fulfillment ran on paper, whiteboards, and phone calls between four disconnected steps</text>

  <g filter="url(#softM)">
    <rect x="48" y="90" width="290" height="200" rx="16" fill="white"></rect>
    <rect x="356" y="90" width="290" height="200" rx="16" fill="white"></rect>
    <rect x="664" y="90" width="290" height="200" rx="16" fill="white"></rect>
    <rect x="972" y="90" width="290" height="200" rx="16" fill="white"></rect>
  </g>

  <circle cx="88" cy="126" r="20" fill="#F7E9EC"></circle><text x="88" y="132" font-size="15" font-weight="800" fill="#9c2444" text-anchor="middle">1</text>
  <text x="120" y="122" font-size="14" font-weight="800" fill="#3a1220">Paper picklists</text>
  <text x="120" y="140" font-size="10.5" fill="#8a7a7d">Printed and handed out</text>
  <g font-size="11.5" fill="#3A3A46">
    <text x="72" y="172">A supervisor printed a list</text>
    <text x="72" y="190">of items per order and</text>
    <text x="72" y="208">handed it to a picker.</text>
    <text x="72" y="226">No record of who picked</text>
    <text x="72" y="244">what, or when.</text>
  </g>
  <rect x="72" y="256" width="238" height="22" rx="11" fill="#F7E9EC"></rect>
  <text x="191" y="271" font-size="10.5" fill="#9c2444" text-anchor="middle" font-weight="700">No audit trail</text>

  <circle cx="396" cy="126" r="20" fill="#FBEFE1"></circle><text x="396" y="132" font-size="15" font-weight="800" fill="#a3610b" text-anchor="middle">2</text>
  <text x="428" y="122" font-size="14" font-weight="800" fill="#3a1220">Whiteboard tallies</text>
  <text x="428" y="140" font-size="10.5" fill="#8a7a7d">Progress tracked by hand</text>
  <g font-size="11.5" fill="#3A3A46">
    <text x="380" y="172">Packing stations marked</text>
    <text x="380" y="190">pending versus packed</text>
    <text x="380" y="208">counts on a whiteboard,</text>
    <text x="380" y="226">erased and rewritten all</text>
    <text x="380" y="244">day, station by station.</text>
  </g>
  <rect x="380" y="256" width="238" height="22" rx="11" fill="#FBEFE1"></rect>
  <text x="499" y="271" font-size="10.5" fill="#a3610b" text-anchor="middle" font-weight="700">No shared visibility</text>

  <circle cx="704" cy="126" r="20" fill="#EAF3EC"></circle><text x="704" y="132" font-size="15" font-weight="800" fill="#2e6b3e" text-anchor="middle">3</text>
  <text x="736" y="122" font-size="14" font-weight="800" fill="#3a1220">Phone coordination</text>
  <text x="736" y="140" font-size="10.5" fill="#8a7a7d">Carrier handoff by call</text>
  <g font-size="11.5" fill="#3A3A46">
    <text x="688" y="172">Dispatch staff called</text>
    <text x="688" y="190">each carrier to confirm</text>
    <text x="688" y="208">pickup volume, often</text>
    <text x="688" y="226">re-counting parcels by</text>
    <text x="688" y="244">hand right before pickup.</text>
  </g>
  <rect x="688" y="256" width="238" height="22" rx="11" fill="#EAF3EC"></rect>
  <text x="807" y="271" font-size="10.5" fill="#2e6b3e" text-anchor="middle" font-weight="700">Slow, error-prone handoff</text>

  <circle cx="1012" cy="126" r="20" fill="#EAF1F8"></circle><text x="1012" y="132" font-size="15" font-weight="800" fill="#2f5d8f" text-anchor="middle">4</text>
  <text x="1044" y="122" font-size="14" font-weight="800" fill="#3a1220">No order traceability</text>
  <text x="1044" y="140" font-size="10.5" fill="#8a7a7d">Status lived in someone&#39;s head</text>
  <g font-size="11.5" fill="#3A3A46">
    <text x="996" y="172">&#34;Where is order #4210&#34;</text>
    <text x="996" y="190">meant walking the floor</text>
    <text x="996" y="208">or calling around, since</text>
    <text x="996" y="226">no single screen showed</text>
    <text x="996" y="244">an order&#39;s real status.</text>
  </g>
  <rect x="996" y="256" width="238" height="22" rx="11" fill="#EAF1F8"></rect>
  <text x="1115" y="271" font-size="10.5" fill="#2f5d8f" text-anchor="middle" font-weight="700">Support could not verify</text>
</svg>