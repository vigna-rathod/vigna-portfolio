<svg viewBox="0 0 1300 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softO" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#3a1220" flood-opacity="0.10"></feDropShadow>
    </filter>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c2444"></path>
    </marker>
  </defs>
  <rect width="1300" height="380" fill="#FAF7F6"></rect>
  <text x="48" y="42" font-size="22" font-weight="800" fill="#3a1220">One order, four names, one continuous flow</text>
  <text x="48" y="64" font-size="13.5" fill="#8a7a7d">The same physical unit of work is tracked under a different name at each stage, matching how warehouse staff actually talk about it on the floor</text>

  <g filter="url(#softO)">
    <rect x="48" y="100" width="270" height="150" rx="16" fill="#FFFFFF"></rect>
    <rect x="358" y="100" width="270" height="150" rx="16" fill="#FFFFFF"></rect>
    <rect x="668" y="100" width="270" height="150" rx="16" fill="#FFFFFF"></rect>
    <rect x="978" y="100" width="270" height="150" rx="16" fill="#FFFFFF"></rect>
  </g>

  <rect x="48" y="100" width="270" height="8" rx="4" fill="#E8A93A"></rect>
  <text x="72" y="132" font-size="13" font-weight="800" fill="#3a1220">Ready to Pick</text>
  <text x="72" y="154" font-size="20" font-weight="800" fill="#9c2444">Picklist</text>
  <text x="72" y="176" font-size="11.5" fill="#6b5a5d">A batch of SKUs to</text>
  <text x="72" y="192" font-size="11.5" fill="#6b5a5d">retrieve, grouped by</text>
  <text x="72" y="208" font-size="11.5" fill="#6b5a5d">order and bin location.</text>
  <text x="72" y="232" font-size="11" fill="#a3610b" font-weight="700">&#34;Picklist #124345&#34;</text>

  <rect x="358" y="100" width="270" height="8" rx="4" fill="#3fa07a"></rect>
  <text x="382" y="132" font-size="13" font-weight="800" fill="#3a1220">Picking</text>
  <text x="382" y="154" font-size="20" font-weight="800" fill="#9c2444">PickBin</text>
  <text x="382" y="176" font-size="11.5" fill="#6b5a5d">Items physically</text>
  <text x="382" y="192" font-size="11.5" fill="#6b5a5d">collected into a bin as</text>
  <text x="382" y="208" font-size="11.5" fill="#6b5a5d">they&#39;re picked from shelves.</text>
  <text x="382" y="232" font-size="11" fill="#a3610b" font-weight="700">&#34;PickBin - A01&#34;</text>

  <rect x="668" y="100" width="270" height="8" rx="4" fill="#3d7ab5"></rect>
  <text x="692" y="132" font-size="13" font-weight="800" fill="#3a1220">Packing</text>
  <text x="692" y="154" font-size="20" font-weight="800" fill="#9c2444">Tote</text>
  <text x="692" y="176" font-size="11.5" fill="#6b5a5d">The same items,</text>
  <text x="692" y="192" font-size="11.5" fill="#6b5a5d">consolidated and moved</text>
  <text x="692" y="208" font-size="11.5" fill="#6b5a5d">to a packing station.</text>
  <text x="692" y="232" font-size="11" fill="#a3610b" font-weight="700">&#34;Tote #124345&#34;</text>

  <rect x="978" y="100" width="270" height="8" rx="4" fill="#9c2444"></rect>
  <text x="1002" y="132" font-size="13" font-weight="800" fill="#3a1220">Dispatch</text>
  <text x="1002" y="154" font-size="20" font-weight="800" fill="#9c2444">Shipment</text>
  <text x="1002" y="176" font-size="11.5" fill="#6b5a5d">A boxed, labeled parcel</text>
  <text x="1002" y="192" font-size="11.5" fill="#6b5a5d">assigned to a carrier</text>
  <text x="1002" y="208" font-size="11.5" fill="#6b5a5d">for delivery.</text>
  <text x="1002" y="232" font-size="11" fill="#a3610b" font-weight="700">&#34;Shipment #12345&#34;</text>

  <g stroke="#9c2444" stroke-width="2.5" marker-end="url(#arrowO)">
    <line x1="318" y1="175" x2="353" y2="175"></line>
    <line x1="628" y1="175" x2="663" y2="175"></line>
    <line x1="938" y1="175" x2="973" y2="175"></line>
  </g>

  <rect x="48" y="280" width="1200" height="70" rx="12" fill="#F7E9EC"></rect>
  <text x="72" y="306" font-size="13.5" font-weight="800" fill="#9c2444">Design decision</text>
  <text x="72" y="326" font-size="12.5" fill="#3A3A46">Each stage keeps its own vocabulary instead of forcing one generic term across the whole flow, because that&#39;s genuinely how</text>
  <text x="72" y="342" font-size="12.5" fill="#3A3A46">warehouse staff refer to their work, and fighting that would have meant retraining language, not just retraining a screen.</text>
</svg>