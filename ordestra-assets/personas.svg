<svg viewBox="0 0 1300 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softQ" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#3a1220" flood-opacity="0.10"></feDropShadow>
    </filter>
  </defs>
  <rect width="1300" height="340" fill="#FAF7F6"></rect>
  <text x="48" y="42" font-size="22" font-weight="800" fill="#3a1220">Two very different users, one system</text>
  <text x="48" y="64" font-size="13.5" fill="#8a7a7d">The interface has to work for someone standing on a warehouse floor and someone sitting at a desk reconciling orders</text>

  <g filter="url(#softQ)">
    <rect x="48" y="90" width="590" height="220" rx="16" fill="white"></rect>
    <rect x="662" y="90" width="590" height="220" rx="16" fill="white"></rect>
  </g>

  <circle cx="88" cy="126" r="20" fill="#FDF3F3"></circle>
  <text x="88" y="132" font-size="15" font-weight="800" fill="#9c2444" text-anchor="middle">W</text>
  <text x="120" y="122" font-size="15" font-weight="800" fill="#3a1220">Warehouse floor operator</text>
  <text x="120" y="140" font-size="11.5" fill="#8a7a7d">Picking, packing, dispatch stations</text>

  <g font-size="12" fill="#3A3A46">
    <text x="72" y="172">→ Standing, moving, often one hand free</text>
    <text x="72" y="194">→ Speed and error-avoidance matter more than detail</text>
    <text x="72" y="216">→ Needs large tap targets, big counts, barcode scan</text>
    <text x="72" y="238">→ Repeats the same few actions hundreds of times/shift</text>
  </g>
  <rect x="72" y="256" width="524" height="34" rx="8" fill="#FDF3F3"></rect>
  <text x="86" y="277" font-size="11.5" fill="#9c2444" font-weight="700">Optimized for: glanceable progress, minimal decisions</text>

  <circle cx="702" cy="126" r="20" fill="#EAF1F8"></circle>
  <text x="702" y="132" font-size="15" font-weight="800" fill="#2f5d8f" text-anchor="middle">D</text>
  <text x="734" y="122" font-size="15" font-weight="800" fill="#3a1220">Dispatch / ops manager</text>
  <text x="734" y="140" font-size="11.5" fill="#8a7a7d">Orders dashboard, reconciliation</text>

  <g font-size="12" fill="#3A3A46">
    <text x="686" y="172">→ Seated, desk-based, full attention on screen</text>
    <text x="686" y="194">→ Accuracy and traceability matter more than speed</text>
    <text x="686" y="216">→ Needs dense tables, full order/shipment history</text>
    <text x="686" y="238">→ Handles exceptions: disputes, returns, delays</text>
  </g>
  <rect x="686" y="256" width="524" height="34" rx="8" fill="#EAF1F8"></rect>
  <text x="700" y="277" font-size="11.5" fill="#2f5d8f" font-weight="700">Optimized for: dense detail, full audit trail</text>
</svg>